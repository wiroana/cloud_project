<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ozeum — Collections</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">Exhibitions • Collections • About</div>

  <header class="nav">
    <div class="wrap">
      <div class="brand">ozeum</div>
      <nav class="menu">
        <a href="#">Home</a>
        <a href="#">Exhibitions</a>
        <a href="#" aria-current="page">Art Gallery</a>
        <a href="#">About us</a>
      </nav>
      <div class="spacer"></div>
      <div class="ctas">
        <a class="btn" href="#">Blog</a>
        <a class="btn" href="#">Contacts</a>
        <a class="btn" href="#">Visit</a>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="inner">
      <div class="kicker">Collections</div>
      <h1>Curated Artworks</h1>
      <div class="breadcrumb">Home / Collections</div>
    </div>
  </section>

  <main class="section">
    <div class="filters">
      <button class="pill" data-filter="all" aria-pressed="true">All</button>
      <button class="pill" data-filter="nature">Nature</button>
      <button class="pill" data-filter="portrait">Portrait</button>
      <button class="pill" data-filter="religious">Religious</button>
    </div>

    <div class="grid" id="grid">
      <!-- ตัวอย่างการ์ด -->
      <article class="card" data-cat="nature">
        <img class="thumb" src="https://images.unsplash.com/photo-1504270997636-07ddfbd48945?q=80&w=1200&auto=format&fit=crop" />
        <div class="meta">Collection · Nature</div>
        <div class="title">Still Life with Flowers</div>
      </article>
      <!-- เพิ่มการ์ดอื่น ๆ ได้ -->
    </div>
  </main>

  <footer class="footer">© Ozeum Museum — Demo Collections</footer>
<link rel="stylesheet" href="css/style.css">
<script src="js/script.js"></script>

</body>
</html>
